providers:
  openai-codex:
    baseUrl: https://chatgpt.com/backend-api/codex
    auth: oauth
    models:
      - id: gpt-5.3-codex-spark
        name: GPT-5.3 Codex Spark
        api: openai-codex-responses
        reasoning: true
        preferWebsockets: true
        input:
          - text
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 128000
